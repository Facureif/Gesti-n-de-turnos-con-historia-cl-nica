{% extends 'core_app/base.html' %}
{% load static %}


{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/pages/pacientes_shared.css' %}">
{% endblock %}

<div class="card" style="margin-bottom: 20px;">
    <h3 style="margin-bottom: 10px;">📎 Adjuntar archivos</h3>
    
    <!-- Zona de arrastrar y soltar -->
    <div id="drop-zone" class="drop-zone"
         ondrop="handleDrop(event)" 
         ondragover="handleDragOver(event)" 
         onclick="document.getElementById('archivos-input').click()">
        <div style="font-size: 2em;">📁</div>
        <p class="drop-zone-text">Arrastrá archivos acá o hacé clic para seleccionar</p>
        <p class="drop-zone-hint">Imágenes (JPG, PNG, GIF, WebP) | Máx. 10 archivos</p>
    </div>
    
    <input type="file" name="archivos" id="archivos-input" multiple accept="image/*" 
           style="display: none;" onchange="mostrarPrevia(this.files)">
    
    <!-- Previa de imágenes -->
    <div id="previa-container" class="previa-container"></div>
    
    <div style="margin-bottom: 10px;">
        <input type="text" name="descripcion_archivo" 
               class="form-input"
               placeholder="Descripción de los archivos (opcional)">
    </div>
</div>

<script>
    const maxFiles = 10;
let archivosSeleccionados = [];

function handleDragOver(e) {
    e.preventDefault();
    e.stopPropagation();
    document.getElementById('drop-zone').classList.add('drag-over');
}

function handleDrop(e) {
    e.preventDefault();
    e.stopPropagation();
    document.getElementById('drop-zone').classList.remove('drag-over');
    
    const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
    agregarArchivos(files);
}

// Limpiar el estilo al salir
document.getElementById('drop-zone').addEventListener('dragleave', function(e) {
    this.classList.remove('drag-over');
});

function mostrarPrevia(fileList) {
    const files = Array.from(fileList).filter(f => f.type.startsWith('image/'));
    agregarArchivos(files);
}

function agregarArchivos(nuevosArchivos) {
    if (archivosSeleccionados.length + nuevosArchivos.length > maxFiles) {
        alert('Máximo ' + maxFiles + ' archivos permitidos.');
        return;
    }
    
    archivosSeleccionados = [...archivosSeleccionados, ...nuevosArchivos];
    actualizarPrevia();
    actualizarInput();
}

function eliminarArchivo(index) {
    archivosSeleccionados.splice(index, 1);
    actualizarPrevia();
    actualizarInput();
}

function actualizarPrevia() {
    const container = document.getElementById('previa-container');
    container.innerHTML = '';
    
    archivosSeleccionados.forEach((file, index) => {
        const reader = new FileReader();
        reader.onload = function(e) {
            const div = document.createElement('div');
            div.className = 'previa-item';
            div.innerHTML = `
                <img src="${e.target.result}" alt="preview">
                <button onclick="eliminarArchivo(${index})" type="button" class="btn-eliminar">✕</button>
            `;
            container.appendChild(div);
        };
        reader.readAsDataURL(file);
    });
}

function actualizarInput() {
    const dt = new DataTransfer();
    archivosSeleccionados.forEach(f => dt.items.add(f));
    document.getElementById('archivos-input').files = dt.files;
}
</script>
